<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <script>
    (function () {
      try { document.documentElement.setAttribute('data-theme', localStorage.getItem('taskboards-theme') || 'dark'); } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="What we are building now, next and later." />
  <meta name="theme-color" content="#09090b" />
  <title>Roadmap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./roadmap.css" />
  <script src="./config.js"></script>
</head>
<body>

  <header class="topbar">
    <div class="wrap topbar__in">
      <a class="brand" href="./index.html">
        <span class="brand__mark" aria-hidden="true">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h6M4 12h10M4 18h14"/><circle cx="17" cy="6" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </span>
        Roadmap
      </a>

      <div class="seg" id="products" role="group" aria-label="Product" hidden></div>

      <span class="grow"></span>

      <div class="actions">
        <a class="btn btn--outline" href="./index.html">Open Taskboards</a>
        <button class="btn btn--text btn--icon" id="btn-theme" aria-label="Toggle light / dark theme" title="Toggle theme"></button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero" id="hero"></section>
    <section class="cols" id="cols" aria-label="Roadmap"></section>
  </main>

  <script src="./roadmap.js"></script>
</body>
</html>
